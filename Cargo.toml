[package]
name = "ores-otel-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared sidecar runtime inherited by product *-sidecar.rs crates"
repository = "https://github.com/ores-otel/ores-otel-sidecar.rs"
readme = "README.md"

[lib]
name = "ores_otel_sidecar"
path = "src/lib.rs"

[[bin]]
name = "ores-otel-sidecar"
path = "src/main.rs"

[dependencies]
basic-toml = "=0.1.10"
flags2env = { git = "https://github.com/flags-2-env/flags-2-env.git", rev = "fbd927d0a9c91617a04ae8f4ee7647253846dbd6", package = "flags2env" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.41"

[lints.rust]
unsafe_code = "forbid"
