[package]
name = "ores-otel-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Shared sidecar runtime inherited by product *-sidecar.rs crates"
repository = "https://github.com/ores-otel/ores-otel-sidecar.rs"
readme = "README.md"

[lib]
name = "ores_otel_sidecar"
path = "src/lib.rs"

[[bin]]
name = "ores-otel-sidecar"
path = "src/main.rs"

[[bin]]
name = "ores-process-lifecycle-agent"
path = "src/bin/ores-process-lifecycle-agent.rs"

[dependencies]
basic-toml = "=0.1.10"
flags2env = { git = "https://github.com/flags-2-env/flags-2-env.git", rev = "fbd927d0a9c91617a04ae8f4ee7647253846dbd6", package = "flags2env" }
ores-locks-and-leases = { git = "https://github.com/ORESoftware/ores-locks-and-leases.git", rev = "9f541b02d4a28665b34b0f70e844473826a8a160", package = "ores-locks-and-leases" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["disk", "system"] }
time = "=0.3.47"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# ORE Rust style requires explicit return statements for named function/method
# return values. Keep that contract even though Clippy normally prefers final
# expressions in expression-oriented Rust.
needless_return = "allow"
