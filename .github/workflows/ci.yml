name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin ores-otel-sidecar
      - uses: actions/checkout@v4
        with:
          repository: ores-otel-test/ores-otel-sidecar-contract-tests
          path: contract-tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contract-tests/package-lock.json
      - run: npm ci
        working-directory: contract-tests
      - name: Serve sidecar and run Playwright, Puppeteer, and Selenium
        env:
          SIDECAR_URL: http://127.0.0.1:19090
          ORES_OTEL_SIDECAR_BIND: 127.0.0.1:19090
        run: |
          set -euo pipefail
          ./target/debug/ores-otel-sidecar &
          sidecar_pid=$!
          trap 'kill "$sidecar_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -sf "$SIDECAR_URL/healthz" >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl -sf "$SIDECAR_URL/healthz" >/dev/null
          (cd contract-tests && npm test)

  distroless-exec-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the real distroless image
        run: docker build --tag ores-otel-sidecar:ci .
      - name: Exercise kubelet-style exec probes
        run: |
          set -euo pipefail
          docker run --detach \
            --name ores-otel-sidecar-probe \
            --read-only \
            --security-opt=no-new-privileges \
            ores-otel-sidecar:ci
          trap 'docker rm --force ores-otel-sidecar-probe >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 50); do
            if docker exec ores-otel-sidecar-probe /ores-otel-sidecar probe; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          docker exec ores-otel-sidecar-probe /ores-otel-sidecar probe-healthz
          docker exec ores-otel-sidecar-probe /ores-otel-sidecar probe-readyz

          if docker exec ores-otel-sidecar-probe \
            /ores-otel-sidecar --definitely-not-declared; then
            echo "unknown arguments must fail closed" >&2
            exit 1
          fi
