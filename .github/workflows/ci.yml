name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  sidecar-config-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install caller-side TypeSpec resolver packages
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            @typespec/compiler@1.15.0 @typespec/json-schema@1.15.0
      - name: Enforce peer TypeSpec and JSON Schema authorities with TJSV
        uses: ORESoftware/typespec-json-schema-validator@7241f8e52dcc4518c72f0fdb5152d6cf66c86656
        with:
          typespec: contracts/sidecar/main.tsp
          schema: contracts/sidecar/authored.schema.json
          instances: contracts/sidecar/instances
          report: contracts/sidecar/tjsv-report.json
          sarif: ''
          quiet: 'false'
      - name: Retain TJSV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-config-tjsv
          path: contracts/sidecar/tjsv-report.json
          if-no-files-found: warn
          retention-days: 14

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin ores-otel-sidecar
      - uses: actions/checkout@v4
        with:
          repository: ores-otel-test/ores-otel-sidecar-contract-tests
          path: contract-tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contract-tests/package-lock.json
      - run: npm ci
        working-directory: contract-tests
      - name: Serve sidecar and run Playwright, Puppeteer, and Selenium
        env:
          SIDECAR_URL: http://127.0.0.1:19090
          ORES_OTEL_SIDECAR_BIND: 127.0.0.1:19090
        run: |
          set -euo pipefail
          ./target/debug/ores-otel-sidecar &
          sidecar_pid=$!
          trap 'kill "$sidecar_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -sf "$SIDECAR_URL/healthz" >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl -sf "$SIDECAR_URL/healthz" >/dev/null
          (cd contract-tests && npm test)

  distroless-exec-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the real distroless image
        run: docker build --tag ores-otel-sidecar:ci .
      - name: Exercise kubelet-style exec probes
        run: |
          set -euo pipefail
          docker run --detach \
            --name ores-otel-sidecar-probe \
            --read-only \
            --security-opt=no-new-privileges \
            ores-otel-sidecar:ci
          trap 'docker rm --force ores-otel-sidecar-probe >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 50); do
            if docker exec ores-otel-sidecar-probe /ores-otel-sidecar probe; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          docker exec ores-otel-sidecar-probe /ores-otel-sidecar probe-healthz
          docker exec ores-otel-sidecar-probe /ores-otel-sidecar probe-readyz

          if docker exec ores-otel-sidecar-probe \
            /ores-otel-sidecar --definitely-not-declared; then
            echo "unknown arguments must fail closed" >&2
            exit 1
          fi
