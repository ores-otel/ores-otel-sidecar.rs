name: lockfile-artifact
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/lockfile-artifact.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate the exact Cargo lockfile
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-den-4253
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
