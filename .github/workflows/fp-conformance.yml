name: fp-conformance

# Functional-programming conformance ratchet.
#
# Pull requests are compared against their exact base SHA with the scanner from
# the proposed head. That makes the gate differential: pre-existing debt cannot
# block unrelated work, but a PR cannot increase any finding count. Pushes to
# main/dev still use the repository's absolute recorded budget.
#
# Language-native checks (cargo clippy, eslint, dart analyze) are configured in
# the tree but not run here, to keep Actions minutes low. See FP-GUIDELINES.md.

on:
  pull_request:
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.dart'
      - 'tools/fp-conformance/**'
      - '.github/workflows/fp-conformance.yml'
  push:
    branches: [main, dev]
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: functional programming conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Scan pull-request delta
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Use the proposed scanner implementation for both trees so a scanner
          # change is evaluated consistently rather than comparing two rule sets.
          cp tools/fp-conformance/fp_conformance.py /tmp/fp_conformance.py

          git checkout --detach "$BASE_SHA"
          python3 /tmp/fp_conformance.py . \
            --write-budget /tmp/fp-base-budget.json \
            --limit 60
          cp /tmp/fp-base-budget.json fp-base-budget.json

          git checkout --detach "$HEAD_SHA"
          python3 /tmp/fp_conformance.py . \
            --json fp-findings.json \
            --budget /tmp/fp-base-budget.json \
            --limit 60

      - name: Scan absolute budget
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 tools/fp-conformance/fp_conformance.py . \
            --json fp-findings.json \
            --budget tools/fp-conformance/budget.json \
            --limit 60

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fp-findings
          path: |
            fp-findings.json
            fp-base-budget.json
          if-no-files-found: ignore
          retention-days: 14
