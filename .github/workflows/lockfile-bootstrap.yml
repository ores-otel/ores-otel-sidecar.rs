name: lockfile-bootstrap

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/adapters/process_lifecycle_cloudflare_do.rs
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: read

jobs:
  resolve-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Resolve lockfile and prove the transport
        run: |
          set -euo pipefail
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 2
