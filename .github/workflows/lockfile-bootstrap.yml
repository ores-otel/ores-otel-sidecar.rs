name: lockfile-bootstrap

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/adapters/process_lifecycle_cloudflare_do.rs
      - .github/workflows/lockfile-bootstrap.yml

# Temporary, same-repository bootstrap only. The write scope exists solely so
# this workflow can commit Cargo's deterministic lockfile back to this PR head.
# This workflow is deleted before the PR is marked ready for review.
permissions:
  contents: write

jobs:
  resolve-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Resolve lockfile and prove the transport
        run: |
          set -euo pipefail
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Commit resolved lockfile to same-repository PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh Cargo.lock for lifecycle lease transport"
          git push origin "HEAD:${HEAD_REF}"
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 2
