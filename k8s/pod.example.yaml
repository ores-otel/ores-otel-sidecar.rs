# Example pod for contract tests. The app container is a stub; the sidecar
# binds loopback only and is probed with exec, never httpGet.
apiVersion: v1
kind: Pod
metadata:
  name: ores-otel-sidecar-example
  labels:
    app: example
spec:
  shareProcessNamespace: false
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      ports:
        - name: http
          containerPort: 8080
    - name: otel-sidecar
      image: ghcr.io/ores-otel/ores-otel-sidecar:main
      imagePullPolicy: IfNotPresent
      stdin: false
      tty: false
      env:
        - name: ORES_OTEL_SIDECAR_BIND
          value: 127.0.0.1:9090
      livenessProbe:
        exec:
          command: ["/ores-otel-sidecar", "probe"]
        periodSeconds: 20
        timeoutSeconds: 2
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
