[package]
org = "ores-otel"
name = "ores-otel-sidecar"
version = "0.1.0"
description = "Shared sidecar runtime inherited by product *-sidecar.rs crates"
license = "MIT"
keywords = ["sidecar", "observability", "k8s", "opentelemetry"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/ores-otel/ores-otel-sidecar.rs"

[build]
command = "cargo build --release --locked --bin ores-otel-sidecar"
outputs = ["target/release/ores-otel-sidecar"]

[bin]
ores-otel-sidecar = "target/release/ores-otel-sidecar"

[install]
adapter = "none"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"
